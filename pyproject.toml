[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daedalus"
version = "0.1.0a0"
description = "Open-source desktop-first IkaBot control center"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "Daedalus contributors"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Development Status :: 2 - Pre-Alpha",
]

[project.urls]
Repository = "https://github.com/itshak/Daedalus"
Issues = "https://github.com/itshak/Daedalus/issues"

[project.optional-dependencies]
client = ["httpx>=0.27"]
desktop = ["httpx>=0.27", "PySide6>=6.8", "PySide6-Fluent-Widgets>=1.11", "keyring>=25", "cryptography>=42", "fastapi>=0.115", "uvicorn>=0.30",  "filelock>=3.16", "selenium>=4.30", "webdriver-manager>=4",
           "undetected-chromedriver>=3.5.5"]
macos-build = ["pyinstaller>=6.13"]
recovery = ["keyring>=25"]
browser-recovery = ["keyring>=25", "playwright>=1.48"]
server = ["fastapi>=0.115", "uvicorn>=0.30", "filelock>=3.16", "cryptography>=42", "keyring>=25"]
dev = ["pytest>=8", "ruff>=0.9", "build>=1", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "filelock>=3.16", "cryptography>=42"]

[project.scripts]
daedalus = "daedalus.cli:main"
daedalus-desktop = "daedalus.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
daedalus = ["desktop/resources/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
