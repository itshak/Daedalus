name: Public source security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Detect accidental credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check private runtime filenames in tracked source
        run: python3 scripts/check_clean_import.py
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Audit runtime Python dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the checked-out Daedalus and engine with the vulnerability scanner
        run: |
          python -m pip install --upgrade pip 'setuptools>=84.1.0' wheel
          python -m pip install -e .
          python -m pip install -e ./engine/ikabot
          python -m pip install pip-audit
      - name: Check installed dependency graph for known vulnerabilities
        run: python -m pip_audit --local --progress-spinner off
