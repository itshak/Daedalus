name: Native macOS app preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build unsigned-preview Daedalus.app
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: cocoa
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source and Mac builder
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,macos-build]"
      - name: Build and ad-hoc sign local app
        run: python packaging/build_macos_app.py --output-dir dist --adhoc-sign
      - name: Verify app identity and absence of private runtime files
        run: |
          test -f dist/Daedalus.app/Contents/MacOS/Daedalus
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dist/Daedalus.app/Contents/Info.plist | grep -Fx io.github.itshak.daedalus
          codesign --verify --deep --strict --verbose=2 dist/Daedalus.app
          if find dist/Daedalus.app -type f \( -name 'tokens.json' -o -name 'accounts.toml' -o -name '*.env' -o -name 'cookies.json' \) | grep .; then
            echo "Unexpected private runtime/configuration path in app" >&2
            exit 1
          fi
      - name: Package legacy ZIP with quarantine-clearing installer
        run: |
          bash -n "packaging/Install Daedalus.command"
          mkdir -p dist/preview-package
          ditto dist/Daedalus.app dist/preview-package/Daedalus.app
          install -m 755 "packaging/Install Daedalus.command" "dist/preview-package/Install Daedalus.command"
          ditto -c -k --sequesterRsrc dist/preview-package dist/Daedalus-macos-preview.zip
      - name: Test installation from the archived download
        run: |
          mkdir -p "$RUNNER_TEMP/daedalus-preview-extract"
          ditto -x -k dist/Daedalus-macos-preview.zip "$RUNNER_TEMP/daedalus-preview-extract"
          test -f "$RUNNER_TEMP/daedalus-preview-extract/Daedalus.app/Contents/MacOS/Daedalus"
          test -f "$RUNNER_TEMP/daedalus-preview-extract/Install Daedalus.command"
          xattr -w com.apple.quarantine '0081;00000000;GitHubActions;' "$RUNNER_TEMP/daedalus-preview-extract/Daedalus.app"
          DAEDALUS_INSTALL_ROOT="$RUNNER_TEMP/daedalus-preview-install" \
            bash "$RUNNER_TEMP/daedalus-preview-extract/Install Daedalus.command"
          test -f "$RUNNER_TEMP/daedalus-preview-install/Daedalus.app/Contents/MacOS/Daedalus"
          codesign --verify --deep --strict "$RUNNER_TEMP/daedalus-preview-install/Daedalus.app"
          if xattr -lr "$RUNNER_TEMP/daedalus-preview-install/Daedalus.app" | grep -q 'com.apple.quarantine:'; then
            echo "Installer failed to clear the app-specific quarantine flag" >&2
            exit 1
          fi
      - name: Build BlindBase HFS+ DMG with verified installer and first-run guidance
        run: python packaging/build_macos_dmg.py --app dist/Daedalus.app --output dist/Daedalus-macos-preview.dmg
      - name: Verify mounted DMG contents and app integrity
        run: |
          mount_dir="$(mktemp -d "$RUNNER_TEMP/daedalus-mounted.XXXXXX")"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" dist/Daedalus-macos-preview.dmg
          trap 'hdiutil detach "$mount_dir" || true' EXIT
          test -f "$mount_dir/Daedalus.app/Contents/MacOS/Daedalus"
          test -L "$mount_dir/Applications"
          test "$(readlink "$mount_dir/Applications")" = /Applications
          test -x "$mount_dir/Install Daedalus.command"
          test -f "$mount_dir/readme_first.txt"
          grep -F 'xattr -cr /Applications/Daedalus.app' "$mount_dir/readme_first.txt"
          bash -n "$mount_dir/Install Daedalus.command"
          codesign --verify --deep --strict "$mount_dir/Daedalus.app"
          # Real quarantined-app behavior can only be validated on the Mac
          # receiving the download. Simulate Finder's extended attribute here
          # and run the exact user-initiated helper shipped inside the DMG.
          quarantine_stage="$RUNNER_TEMP/daedalus-dmg-quarantine-source"
          mkdir -p "$quarantine_stage"
          ditto "$mount_dir/Daedalus.app" "$quarantine_stage/Daedalus.app"
          cp "$mount_dir/Install Daedalus.command" "$quarantine_stage/Install Daedalus.command"
          xattr -w com.apple.quarantine '0081;00000000;GitHubActions;' "$quarantine_stage/Daedalus.app"
          DAEDALUS_INSTALL_ROOT="$RUNNER_TEMP/daedalus-dmg-install-test" \
            bash "$quarantine_stage/Install Daedalus.command"
          codesign --verify --deep --strict "$RUNNER_TEMP/daedalus-dmg-install-test/Daedalus.app"
          if xattr -lr "$RUNNER_TEMP/daedalus-dmg-install-test/Daedalus.app" | grep -q 'com.apple.quarantine:'; then
            echo "DMG installer failed to clear app-specific quarantine" >&2
            exit 1
          fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$mount_dir/Daedalus.app/Contents/Info.plist")" = io.github.itshak.daedalus
          hdiutil detach "$mount_dir"
          trap - EXIT
      - name: Upload drag-and-drop macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: Daedalus-macos-dmg
          path: dist/Daedalus-macos-preview.dmg
          if-no-files-found: error
          retention-days: 7
      - name: Upload legacy ZIP preview as an alternative
        uses: actions/upload-artifact@v4
        with:
          name: Daedalus-macos-app-preview
          path: dist/Daedalus-macos-preview.zip
          if-no-files-found: error
          retention-days: 7

  # Actions artifacts are always downloaded as a ZIP. A GitHub Release asset
  # instead serves the verified .dmg itself, without wrapping it in another ZIP.
  # Keep write privileges completely out of pull-request build jobs.
  publish-direct-dmg:
    name: Publish directly downloadable macOS DMG
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Retrieve verified DMG from the successful macOS build
        uses: actions/download-artifact@v4
        with:
          name: Daedalus-macos-dmg
          path: release-assets

      - name: Verify DMG exists and publish its checksum
        shell: bash
        run: |
          test -s release-assets/Daedalus-macos-preview.dmg
          cd release-assets
          sha256sum Daedalus-macos-preview.dmg > Daedalus-macos-preview.dmg.sha256

      - name: Publish direct GitHub prerelease assets (no ZIP wrapper)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="desktop-preview-${SOURCE_SHA:0:12}"
          cat > release-notes.md <<'EOF'
          Unnotarized macOS development preview. The .dmg is a **direct release
          download**, not an Actions artifact inside a ZIP.

          **Important:** This build is ad-hoc signed and not notarized by Apple.
          A direct DMG does not remove macOS Gatekeeper first-launch prompts.
          Avoid disabling Gatekeeper; Apple Developer ID signing and notarization
          are needed for ordinary first-launch distribution.

          Install: download the DMG and open it. Like BlindBase, the DMG
          includes readme_first.txt with the xattr command required if macOS
          quarantines a drag-and-drop first install. You may alternatively
          explicitly run Install Daedalus.command to verify, copy, and clear
          quarantine for your own ~/Applications installation. The DMG never
          auto-runs commands. For the exact build and source, see below.
          EOF
          printf '\nSource commit: `%s`\n' "$SOURCE_SHA" >> release-notes.md
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/Daedalus-macos-preview.dmg \
              release-assets/Daedalus-macos-preview.dmg.sha256 --clobber --repo "$REPO"
            gh release edit "$tag" --notes-file release-notes.md --repo "$REPO"
          else
            gh release create "$tag" \
              release-assets/Daedalus-macos-preview.dmg \
              release-assets/Daedalus-macos-preview.dmg.sha256 \
              --repo "$REPO" --target "$SOURCE_SHA" --prerelease \
              --title "Daedalus Desktop Preview ${SOURCE_SHA:0:12}" \
              --notes-file release-notes.md
          fi
          url="$(gh release view "$tag" --repo "$REPO" --json assets \
            --jq '.assets[] | select(.name == "Daedalus-macos-preview.dmg") | .url')"
          test -n "$url"
          echo "Direct DMG: $url"
          printf '### Direct macOS DMG\n\n[Download the .dmg directly](%s)\n' \
            "$url" >> "$GITHUB_STEP_SUMMARY"
