name: Web control center
on:
  push:
    branches: [main]
    paths: ['apps/web/**', 'tests/test_web_browser_e2e.py', '.github/workflows/web.yml']
  pull_request:
    paths: ['apps/web/**', 'tests/test_web_browser_e2e.py', '.github/workflows/web.yml']
permissions:
  contents: read
jobs:
  verify-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install synthetic browser test runner
        working-directory: .
        run: |
          python -m pip install pytest playwright==1.65.2
          python -m playwright install --with-deps chromium
      - name: Verify authenticated web UI and real gateway with local synthetic services
        working-directory: .
        env:
          DAEDALUS_RUN_WEB_E2E: '1'
        run: python -m pytest -q tests/test_web_browser_e2e.py
