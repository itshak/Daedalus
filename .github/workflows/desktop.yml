name: Native desktop smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-desktop:
    name: macOS Fluent UI / Python 3.11
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: cocoa
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native UI from current checkout
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,desktop]"
      - name: Verify headless GUI layouts and nonsecret dashboard behavior
        run: |
          python -m pytest -q tests/test_desktop.py tests/test_desktop_parity.py
          python -m pytest -q tests/test_task_page.py tests/test_live_auth_gui.py
      - name: Confirm desktop CLI is installed
        run: python -c "from daedalus.desktop import main; assert callable(main)"
      - name: Verify optional synthetic screenshot harness is available
        # Hosted macOS lacks a real logged-in Cocoa desktop; constructing a
        # frameless native window for screenshots segfaults in qframelesswindow.
        # Real Cocoa widget smoke above remains required. Screenshot capture
        # is available for an interactive Mac or offscreen Linux dev machine.
        run: python -c "from scripts.capture_native_ui import capture; assert callable(capture)"

  browser-recovery:
    name: Synthetic Playwright / Chromium cookie isolation
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install current recovery source and test browser
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,browser-recovery]"
          python -m playwright install --with-deps chromium
      - name: Verify real Chromium cookies, with all page traffic intercepted offline
        run: |
          python -m pytest -q tests/test_browser_recovery.py tests/test_live_auth_readiness.py
          python -m pytest -q tests/test_client.py
