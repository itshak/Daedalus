name: Native desktop smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-desktop:
    name: macOS Fluent UI / Python 3.11
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: cocoa
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native UI from current checkout
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,desktop]"
      - name: Verify headless GUI layouts and nonsecret dashboard behavior
        run: |
          for suite in test_desktop test_desktop_parity test_desktop_account_scopes test_desktop_redesign test_compact_native_ui; do
            python -m pytest -q "tests/${suite}.py"
          done
          python -m pytest -q tests/test_task_page.py tests/test_native_task_editors.py tests/test_live_auth_gui.py
          python -m pytest -q tests/test_selenium_warehouse_login.py tests/test_selenium_isolated_process.py tests/test_selenium_login_gui.py
      - name: Confirm desktop CLI is installed
        run: python -c "from daedalus.desktop import main; assert callable(main)"
      - name: Verify optional synthetic screenshot harness is available
        # Hosted macOS lacks a real logged-in Cocoa desktop; constructing a
        # frameless native window for screenshots segfaults in qframelesswindow.
        # Real Cocoa widget smoke above remains required. Screenshot capture
        # is available for an interactive Mac or offscreen Linux dev machine.
        run: python -c "from scripts.capture_native_ui import capture; assert callable(capture)"

  browser-recovery:
    name: Synthetic Playwright / Chromium cookie isolation
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install current recovery source and test browser
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,browser-recovery]"
          python -m playwright install --with-deps chromium
      - name: Verify real Chromium cookies, with all page traffic intercepted offline
        run: |
          python -m pytest -q tests/test_browser_recovery.py tests/test_live_auth_readiness.py
          python -m pytest -q tests/test_client.py

  linux-synthetic-screenshots:
    name: Linux offscreen synthetic desktop screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install offscreen Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
          python -m pip install -e ".[dev,desktop]"
      - name: Isolated native theme and layout regressions
        run: python -m pytest -q tests/test_desktop_theme.py
      - name: Generate and validate synthetic captures
        run: |
          python scripts/capture_native_ui.py --output-dir "${RUNNER_TEMP}/daedalus-synthetic-screenshots"
          python -c 'from pathlib import Path; import os; from PySide6.QtGui import QImage; paths=list((Path(os.environ["RUNNER_TEMP"])/"daedalus-synthetic-screenshots").glob("*.png")); assert len(paths)==142; assert all(not QImage(str(p)).isNull() and QImage(str(p)).width()>=900 and QImage(str(p)).height()>=650 for p in paths)'
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-desktop-screenshots
          path: ${{ runner.temp }}/daedalus-synthetic-screenshots
          if-no-files-found: error
          retention-days: 7
