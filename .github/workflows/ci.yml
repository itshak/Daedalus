name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install from checked-out source
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
        shell: bash
      - name: Lint
        run: python -m ruff check src tests
      - name: Offline unit tests
        run: python -m pytest -q
      - name: Offline CLI smoke
        run: python -m daedalus doctor

  openspec:
    name: OpenSpec strict validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned OpenSpec
        run: npm install --global @fission-ai/openspec@1.13.0
      - name: Validate every spec and change
        run: openspec validate --all --strict --no-interactive
