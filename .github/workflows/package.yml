name: Source package checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build from this Git checkout
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verify built distribution metadata
        run: |
          python -m pip install dist/*.whl
          daedalus --version
          daedalus doctor
      - name: Verify clean installed server extra and offline smoke
        shell: bash
        run: |
          wheel=(dist/*.whl)
          python -m pip install "${wheel[0]}[server]"
          python -m daedalus doctor --smoke
      - name: Upload distribution candidate (not PyPI)
        uses: actions/upload-artifact@v4
        with:
          name: daedalus-source-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 7
